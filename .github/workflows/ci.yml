name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskflow-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: taskflow-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint || true
      - run: npm run test -- --run

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskflow-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: taskflow-backend/package-lock.json
      - run: npm ci
      - run: npm run test